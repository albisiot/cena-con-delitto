name: Tieni attivo il server

# I progetti gratuiti di Supabase vanno in pausa se restano inattivi.
# Se il server non risponde questo controllo fallisce e GitHub avvisa via email.
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 20 --output /dev/null "$API_URL/api/packs"
        env:
          API_URL: ${{ vars.API_URL }}
